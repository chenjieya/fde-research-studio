# 前端部署配置：静态页面由 Nginx 提供，/api 请求转给后端。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # 视频上传上限与服务端一致；生成结果通过媒体引用单独下载。
    client_max_body_size 32m;

    location /api/ {
        # 和 Vite 开发代理一致：/api/workspace -> /prism/workspace。
        proxy_pass http://agent:8000/prism/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location / {
        # 刷新页面时回到入口文件，页面内导航由前端接管。
        try_files $uri $uri/ /index.html;
    }
}
