# 后端配置：Python 项目、依赖、打包方式和 Ruff 检查规则。
[build-system]
# uv 安装本项目时调用 setuptools；生成的 egg-info 是临时构建产物。
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-research-server"
version = "0.2.0"
description = "Prism research workspace Agent Server and runtime API"
requires-python = ">=3.11,<3.14"
dependencies = [
  "langgraph>=1.0,<2",
  "langgraph-sdk>=0.3,<0.5",
  "langsmith>=0.4,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "langchain-openai>=1,<2",
  "langchain-anthropic>=1,<2",
  "cryptography>=46",
]

[dependency-groups]
# 开发时才需要的图服务命令和代码检查工具。
dev = ["langgraph-cli[inmem]>=0.4,<0.5", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
# 源码放在 server/src，安装后可以直接 import prism_server。
where = ["server/src"]

[tool.setuptools.package-data]
# 打包时带上 SQL 迁移文件，服务器启动才能创建和升级业务表。
"prism_server.db" = ["migrations/*.sql"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# 检查常见错误、导入顺序、过时写法和异步代码问题。
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
